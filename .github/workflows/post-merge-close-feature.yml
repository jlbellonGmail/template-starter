name: Post-merge feature close

on:
  pull_request_target:
    types: [closed]
    branches: [develop]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: close-feature-develop
  cancel-in-progress: false

jobs:
  close-feature:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Derivar slug y modo de work unit
        id: feature
        shell: bash
        run: |
          head_ref='${{ github.event.pull_request.head.ref }}'
          if [[ "$head_ref" =~ ^feature/(v[0-9]+\.[0-9]+\.[0-9]+)-([0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "slug=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "branch=$head_ref" >> "$GITHUB_OUTPUT"
            echo "mode=Feature" >> "$GITHUB_OUTPUT"
          elif [[ "$head_ref" =~ ^feature/([0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*)$ ]]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "slug=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$head_ref" =~ ^milestone/([a-z0-9]+(-[a-z0-9]+)*)$ ]]; then
            echo "slug=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "branch=$head_ref" >> "$GITHUB_OUTPUT"
            echo "mode=Milestone" >> "$GITHUB_OUTPUT"
          elif [[ "$head_ref" =~ ^maintenance/(v[0-9]+\.[0-9]+\.[0-9]+)-((T[0-9]{2})-[a-z0-9]+(-[a-z0-9]+)*)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            # close-feature.ps1 resuelve la unidad TNN canónica desde ROADMAP.
            # El sufijo de una rama correctiva no es identidad de ROADMAP.
            echo "slug=" >> "$GITHUB_OUTPUT"
            echo "branch=$head_ref" >> "$GITHUB_OUTPUT"
            echo "mode=Maintenance" >> "$GITHUB_OUTPUT"
          else
            echo "La rama '$head_ref' no sigue feature/NN-slug ni milestone/slug; no hay cierre automatico de ROADMAP."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted develop
        if: steps.feature.outputs.skip != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Git
        if: steps.feature.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolver alcance de maintenance
        id: maintenance
        if: steps.feature.outputs.skip != 'true'
        shell: pwsh
        run: |
          if ('${{ steps.feature.outputs.mode }}' -eq 'Maintenance') {
            . ./scripts/workunit-lib.ps1
            $scope = Resolve-MaintenanceScope -Branch '${{ steps.feature.outputs.branch }}' -RoadmapPath 'ROADMAP.md'
            "scope=$($scope.Scope)" >> $env:GITHUB_OUTPUT
            "canonical_slug=$($scope.CanonicalSlug)" >> $env:GITHUB_OUTPUT
            "close_roadmap=$($scope.CloseRoadmap.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            "reason=$($scope.Reason)" >> $env:GITHUB_OUTPUT
          } else {
            "scope=canonical-unit" >> $env:GITHUB_OUTPUT
            "close_roadmap=true" >> $env:GITHUB_OUTPUT
          }

      - name: Cerrar feature en ROADMAP remoto
        if: steps.feature.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/close-feature.ps1 `
            -Slug '${{ steps.feature.outputs.slug }}' `
            -Branch '${{ steps.feature.outputs.branch }}' `
            -Mode '${{ steps.feature.outputs.mode }}' `
            -Version '${{ steps.feature.outputs.version }}' `
            -PrNumber ${{ github.event.pull_request.number }} `
            -SkipLocalCleanup

      - name: Sincronizar STATUS en develop
        if: steps.feature.outputs.skip != 'true' && steps.maintenance.outputs.scope != 'auxiliary'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/update-status.ps1
          git add STATUS.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: sincronizar STATUS post-merge"
            git push origin develop
          } else {
            Write-Host "STATUS.md ya estaba sincronizado; no se crea commit vacio."
          }
