name: Post-HITL merge gate

# Dos disparadores:
# - pull_request_review (submitted): el HITL real, cuando el humano
#   aprueba (o revisa) la PR.
# - pull_request (synchronize): Builder pushea commits nuevos a una PR que
#   YA estaba aprobada pero cuyos checks post-HITL habian fallado. Sin
#   este segundo trigger, nada volveria a correr complete-approved-pr.ps1
#   despues del fix, y pedir una segunda aprobacion humana violaria la
#   regla de "unico HITL". El gateo real de "esta aprobada de verdad" no
#   se hace en el YAML (el evento 'synchronize' no trae reviewDecision
#   confiable) sino adentro de complete-approved-pr.ps1, que consulta
#   'gh pr view' en vivo y lanza error claro si reviewDecision no es
#   APPROVED -- eso es deseado y no bloquea el job, solo hace que termine
#   sin mergear ni comentar como si fuera un segundo HITL.
on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: post-hitl-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  complete-approved-pr:
    if: |
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.base.ref == 'develop') ||
      (github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.base.ref == 'develop')
    runs-on: ubuntu-latest
    steps:
      - name: Derivar slug y modo de work unit
        id: feature
        shell: bash
        run: |
          head_ref='${{ github.event.pull_request.head.ref }}'
          if [[ "$head_ref" =~ ^feature/(v[0-9]+\.[0-9]+\.[0-9]+)-([0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "slug=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "branch=$head_ref" >> "$GITHUB_OUTPUT"
            echo "mode=Feature" >> "$GITHUB_OUTPUT"
          elif [[ "$head_ref" =~ ^feature/([0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*)$ ]]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "slug=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$head_ref" =~ ^milestone/([a-z0-9]+(-[a-z0-9]+)*)$ ]]; then
            echo "slug=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "branch=$head_ref" >> "$GITHUB_OUTPUT"
            echo "mode=Milestone" >> "$GITHUB_OUTPUT"
          elif [[ "$head_ref" =~ ^maintenance/(v[0-9]+\.[0-9]+\.[0-9]+)-((T[0-9]{2})-[a-z0-9]+(-[a-z0-9]+)*)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "slug=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "branch=$head_ref" >> "$GITHUB_OUTPUT"
            echo "mode=Maintenance" >> "$GITHUB_OUTPUT"
          else
            echo "La rama '$head_ref' no sigue feature/NN-slug ni milestone/slug; no hay merge automatico."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted develop
        if: steps.feature.outputs.skip != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Completar PR aprobada si CI esta verde
        if: steps.feature.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_root='runs'
          if [[ -n '${{ steps.feature.outputs.version }}' ]]; then
            run_root="runs/${{ steps.feature.outputs.version }}"
          fi
          ./scripts/complete-approved-pr.ps1 `
            -Slug '${{ steps.feature.outputs.slug }}' `
            -Branch '${{ steps.feature.outputs.branch }}' `
            -Mode '${{ steps.feature.outputs.mode }}' `
            -Version '${{ steps.feature.outputs.version }}' `
            -PrNumber ${{ github.event.pull_request.number }} `
            -SkipLocalCleanup `
            -CommentOnFailure `
            -GovernanceMode SingleMaintainer `
            -PreAuthorizedHumanMerge `
            -AuthorizationPath "$run_root/${{ steps.feature.outputs.slug }}/human-authorization.md" `
            -IndependentReviewPath "$run_root/${{ steps.feature.outputs.slug }}/independent-review.md" `
            -IntegrityEvidencePath "$run_root/${{ steps.feature.outputs.slug }}/integrity-evidence.md"
